name: Release package

on:
  push:
    tags:
      - "test-v*.*.*"
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate version tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compare the tag with pyproject.toml
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if tag.startswith("test-v"):
              tag_version = tag.removeprefix("test-v")
              repository = "TestPyPI"
          elif tag.startswith("v"):
              tag_version = tag.removeprefix("v")
              repository = "PyPI"
          else:
              raise SystemExit(f"Unsupported release tag: {tag}")

          with open("pyproject.toml", "rb") as file:
              project_version = tomllib.load(file)["project"]["version"]

          if tag_version != project_version:
              raise SystemExit(
                  "Version mismatch: "
                  f"tag contains {tag_version!r}, but pyproject.toml "
                  f"contains {project_version!r}."
              )

          print(f"Validated {project_version} for {repository}.")
          PY

  ci:
    name: Run CI
    needs: validate-version
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build the wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Test the built wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/hiprof-wheel-test"
          "$RUNNER_TEMP/hiprof-wheel-test/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/hiprof-wheel-test/bin/python" -c "import hiprof"

      - name: Store distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    if: startsWith(github.ref_name, 'test-v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hiprof
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hiprof
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
